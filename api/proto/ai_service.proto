syntax = "proto3";

package mcf.ai.v1;

// path generated by protoc-gen-go.
// option go_package = "mcf/services/logic/internal/pb";
option go_package = "mcf/services/logic/internal/pb/api/proto";

// ---------------------------------------------------------
// SERVICE DEFINITION
// ---------------------------------------------------------
service TranslationService {
  rpc ProcessMediaStream(stream MediaRequest) returns (stream MediaResponse);
  rpc ProcessVideoStream(stream VideoRequest) returns (stream VideoResponse);
}

// ---------------------------------------------------------
// REQUEST DEFINITION (Go -> Python)
// ---------------------------------------------------------
message MediaRequest {
  string session_id = 1;

  message Config {
    string source_language = 1;
    string target_language = 2;
    bool   enable_tts      = 3;
    int32  sample_rate     = 4;
  }

  // using 'oneof' to classify: one request can only be either config or media chunk.
  oneof payload {
    Config config      = 2; // setup
    bytes  audio_chunk = 3; // pcm audio data
  }

  int64 sequence_number = 4; // to maintain the order of requests
  bool  is_eos          = 5; // end of stream indicator
}

// ---------------------------------------------------------
// RESPONSE DEFINITION (Python -> Go)
// ---------------------------------------------------------
message MediaResponse {
  string session_id = 1;

  // text response (serve HTTPGW export subtitles)
  string recognized_text = 2; // ASR
  string translated_text = 3; // MT

  // flag to indicate if this is the final response for the current session
  bool is_final = 4;

  // audio data (RTPGW audio response)
  bytes tts_audio_chunk = 5; // pcm audio data
}

message VideoConfig {
  string effect_type = 1;
  uint32 inference_width = 2;
  uint32 inference_height = 3;
  uint32 inference_fps = 4;
  float threshold = 5;
}

message VideoFrame {
  int64 frame_id = 1;
  int64 rtp_timestamp = 2;
  int32 original_width = 3;
  int32 original_height = 4;
  string encoding = 5;
  bytes image_data = 6;
}

message VideoRequest {
  string session_id = 1;
  bool is_eos = 2;

  oneof payload {
    VideoConfig config = 3;
    VideoFrame frame = 4;
  }
}

message VideoMask {
  int64 frame_id = 1;
  int64 rtp_timestamp = 2;
  int32 mask_width = 3;
  int32 mask_height = 4;
  repeated uint32 rle_counts = 5;
  float latency_ms = 6;
  string status = 7;
  string error_message = 8;
}

message VideoResponse {
  string session_id = 1;
  VideoMask mask = 2;
  bool is_final = 3;
}